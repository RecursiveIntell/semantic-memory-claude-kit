name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate kit package (no native runtime certification)
        run: ./scripts/validate-all-kits.sh --static
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Check generated plugin assets
        run: python scripts/sync-kit-assets.py --check

      - name: Run behavior regressions
        run: python -m pytest -q -rs
